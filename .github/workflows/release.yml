name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "*.*"
      - "*.*.*"

permissions:
  contents: write

env:
  APP_NAME: FH6_ShuaShuaLe
  PYTHON_VERSION: "3.11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    name: Build Windows package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name "${env:APP_NAME}" `
            --icon "app.ico" `
            --add-data "images;images" `
            --add-data "resources;resources" `
            "main.py"

      - name: Copy project files
        shell: pwsh
        run: |
          Copy-Item "README.md" "dist/${env:APP_NAME}/README.md"
          Copy-Item "LICENSE" "dist/${env:APP_NAME}/LICENSE"

      - name: Create zip package
        shell: pwsh
        run: |
          $zipPath = "dist/${env:APP_NAME}-windows.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath
          }
          Compress-Archive -Path "dist/${env:APP_NAME}/*" -DestinationPath $zipPath

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows
          path: dist/${{ env.APP_NAME }}-windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APP_NAME }}-windows.zip
          generate_release_notes: true
